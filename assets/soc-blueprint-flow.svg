<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#080d1a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,0.6);">
  <defs>
    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="520" fill="#080d1a" />
  <rect width="1000" height="520" fill="url(#cyber-grid)" />

  <!-- Outer Neon Frame -->
  <rect x="15" y="15" width="970" height="490" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="15" y="15" width="970" height="490" rx="10" fill="none" stroke="#00f2fe" stroke-width="1" stroke-opacity="0.2" />

  <!-- Header Section -->
  <g transform="translate(40, 48)">
    <circle cx="8" cy="8" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="12" fill="#00f2fe" font-size="11" font-weight="700" letter-spacing="2">SYSTEM BLUEPRINT // REAL-TIME EVENT STREAM</text>
    <text x="24" y="32" fill="#ffffff" font-size="20" font-weight="800">Unified SOC &amp; Deception Architecture</text>
    <text x="580" y="32" fill="#94a3b8" font-size="12">Linux / Raspberry Pi 4/5 ARM64 · Event-Driven</text>
  </g>

  <!-- ==================== FLOW PATHS (Background Animated Lines) ==================== -->

  <!-- Path 1: Attacker -> Honeypot (Red laser) -->
  <path id="path1" d="M 190 170 L 290 170" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" repeatCount="indefinite" />
  </path>
  <!-- Moving Red Packet -->
  <circle r="4" fill="#f43f5e" filter="url(#glow-red)">
    <animateMotion path="M 190 170 L 290 170" dur="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Path 2: Honeypot -> SOC Backend (Purple) -->
  <path id="path2" d="M 440 170 L 530 170" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="6,4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.2s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#c084fc" filter="url(#glow-purple)">
    <animateMotion path="M 440 170 L 530 170" dur="1.4s" repeatCount="indefinite" />
  </circle>

  <!-- Path 3: Zabbix Telemetry -> SOC Backend (Blue) -->
  <path id="path3" d="M 440 370 L 485 370 L 485 230 L 530 230" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1.5s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#38bdf8" filter="url(#glow-cyan)">
    <animateMotion path="M 440 370 L 485 370 L 485 230 L 530 230" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Path 4: Backend -> AI Brain (Green/Indigo Loop) -->
  <path id="path4" d="M 680 180 L 760 180" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1s" repeatCount="indefinite" />
  </path>
  <circle r="5" fill="#818cf8" filter="url(#glow-purple)">
    <animateMotion path="M 680 180 L 760 180" dur="1.1s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#10b981" filter="url(#glow-green)">
    <animateMotion path="M 760 210 L 680 210" dur="1.1s" repeatCount="indefinite" />
  </circle>

  <!-- Path 5: Backend -> Cockpit Dashboard (Cyan WebSocket) -->
  <path id="path5" d="M 605 270 L 605 350 L 760 350" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-dasharray="6,4">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="1.2s" repeatCount="indefinite" />
  </path>
  <circle r="4.5" fill="#00f2fe" filter="url(#glow-cyan)">
    <animateMotion path="M 605 270 L 605 350 L 760 350" dur="1.3s" repeatCount="indefinite" />
  </circle>

  <!-- Path 6: Backend -> Auto IP Drop (Red alert) -->
  <path id="path6" d="M 540 270 L 540 450 L 440 450" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,4">
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1.4s" repeatCount="indefinite" />
  </path>
  <circle r="4" fill="#ef4444" filter="url(#glow-red)">
    <animateMotion path="M 540 270 L 540 450 L 440 450" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== ARCHITECTURE NODES (CARDS) ==================== -->

  <!-- NODE 1: Threat Ingress / Attacker -->
  <g transform="translate(40, 120)">
    <rect width="150" height="100" rx="8" fill="url(#glow-card)" stroke="#f43f5e" stroke-width="1.8" />
    <!-- Pulsing Radar on Attacker -->
    <circle cx="28" cy="30" r="14" fill="#f43f5e" fill-opacity="0.2">
      <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="30" r="7" fill="#f43f5e" />
    <text x="50" y="34" fill="#f43f5e" font-size="13" font-weight="700">ATTACKER</text>
    <text x="18" y="62" fill="#cbd5e1" font-size="11">Port Recon &amp; Scans</text>
    <text x="18" y="80" fill="#94a3b8" font-size="10">SSH / SQLi / Probes</text>
  </g>

  <!-- NODE 2: Deception Engine (Honeypot) -->
  <g transform="translate(290, 120)">
    <rect width="150" height="100" rx="8" fill="url(#glow-card)" stroke="#c084fc" stroke-width="1.8" />
    <circle cx="26" cy="30" r="6" fill="#c084fc">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="34" fill="#c084fc" font-size="13" font-weight="700">DECEPTION</text>
    <text x="16" y="60" fill="#cbd5e1" font-size="11">🍯 Honey-Port :2323</text>
    <text x="16" y="76" fill="#cbd5e1" font-size="11">🛒 Decoy Store :8081</text>
    <text x="16" y="92" fill="#94a3b8" font-size="9">Canary DB &amp; Config traps</text>
  </g>

  <!-- NODE 3: Zabbix & Wazuh Telemetry -->
  <g transform="translate(290, 320)">
    <rect width="150" height="100" rx="8" fill="url(#glow-card)" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="26" cy="30" r="6" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="34" fill="#38bdf8" font-size="13" font-weight="700">TELEMETRY</text>
    <text x="16" y="60" fill="#cbd5e1" font-size="11">🔷 Zabbix Agent API</text>
    <text x="16" y="76" fill="#cbd5e1" font-size="11">🛡️ Wazuh SIEM Logs</text>
    <text x="16" y="92" fill="#94a3b8" font-size="9">CPU/RAM/Disk Metrics</text>
  </g>

  <!-- NODE 4: Core SOC Engine (Center Hub) -->
  <g transform="translate(530, 130)">
    <rect width="150" height="140" rx="10" fill="url(#glow-card)" stroke="#10b981" stroke-width="2.2" filter="url(#glow-green)" stroke-opacity="0.8"/>
    <circle cx="28" cy="32" r="8" fill="#10b981">
      <animate attributeName="r" values="6;9;6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="36" fill="#10b981" font-size="14" font-weight="800">SOC CORE</text>
    <text x="18" y="66" fill="#f8fafc" font-size="11" font-weight="600">📡 WebSocket Bus</text>
    <text x="18" y="84" fill="#cbd5e1" font-size="10">⚡ Node.js REST API</text>
    <text x="18" y="102" fill="#cbd5e1" font-size="10">💾 SQLite DB Ledger</text>
    <text x="18" y="120" fill="#34d399" font-size="10">⛔ Policy Rate-Limit</text>
  </g>

  <!-- NODE 5: AI Brain (Air-Gapped LLM) -->
  <g transform="translate(760, 130)">
    <rect width="190" height="110" rx="8" fill="url(#glow-card)" stroke="#818cf8" stroke-width="2" />
    <circle cx="28" cy="30" r="7" fill="#818cf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="34" fill="#818cf8" font-size="13" font-weight="800">AI BRAIN (Qwen-4B)</text>
    <text x="18" y="58" fill="#cbd5e1" font-size="11">🤖 Offline Llamafile</text>
    <text x="18" y="74" fill="#cbd5e1" font-size="11">🎯 Next-Attack Predictor</text>
    <text x="18" y="90" fill="#cbd5e1" font-size="11">📚 Case Memory / MITRE</text>
  </g>

  <!-- NODE 6: Frontend Cockpit Dashboard -->
  <g transform="translate(760, 290)">
    <rect width="190" height="120" rx="8" fill="url(#glow-card)" stroke="#00f2fe" stroke-width="2" />
    <circle cx="28" cy="30" r="6" fill="#00f2fe">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="34" fill="#00f2fe" font-size="13" font-weight="800">SOC COCKPIT</text>
    <text x="18" y="60" fill="#cbd5e1" font-size="11">📊 Live Unified UI</text>
    <text x="18" y="78" fill="#cbd5e1" font-size="11">🌐 Network Flow Graph</text>
    <text x="18" y="96" fill="#cbd5e1" font-size="11">🚨 MITRE ATT&amp;CK Kanban</text>
  </g>

  <!-- NODE 7: Active Defense & IP Blacklist -->
  <g transform="translate(290, 420)">
    <rect width="150" height="60" rx="6" fill="url(#glow-card)" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="24" cy="30" r="5" fill="#ef4444"/>
    <text x="38" y="34" fill="#ef4444" font-size="12" font-weight="700">AUTO DEFENSE</text>
    <text x="16" y="50" fill="#cbd5e1" font-size="10">🚫 IP Blacklist &amp; n8n hooks</text>
  </g>

  <!-- Pulse Status Footer -->
  <g transform="translate(40, 480)">
    <text x="0" y="0" fill="#64748b" font-size="11">PIPELINE METRICS:  Latency &lt; 50ms  |  Poll Interval: 5s  |  MITRE Correlation: Active  |  LLM Inference: 100% Offline</text>
  </g>
</svg>
